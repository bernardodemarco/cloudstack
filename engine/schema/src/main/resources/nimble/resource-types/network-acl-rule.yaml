tosca_definitions_version: tosca_2_0

description: >
  NetworkAclRule node type definition.

node_types: 
  NetworkAclRule:
    properties:
      acl-id:
        type: string
        description: The ID of the ACL this rule belongs to.
        required: true
      number:
        type: integer
        description: The priority number of the network ACL rule.
        required: true
      cidr-list:
        type: list
        entry_schema:
          type: string
        description: The CIDR list for the network ACL rule.
        required: true
      action:
        type: string
        validation: { $valid_values: [ $value, [allow, deny] ] }
        description: "The action of the network ACL rule. Valid values are: 'allow' or 'deny'."
        required: true
      protocol:
        type: string
        validation: { $valid_values: [ $value, [TCP, UDP, ICMP, ALL] ] }
        description: "The protocol of the network ACL rule. Valid values are: 'TCP', 'UDP', 'ICMP' or 'ALL'."
        required: true
      traffic-type:
        type: string
        validation: { $valid_values: [ $value, [ ingress, egress ] ] }
        description: "The traffic type of the network ACL rule. Valid values are: 'ingress' or 'egress'."
        required: true
      start-port:
        type: integer
        description: The starting port of the network ACL rule.
        required: false
      end-port:
        type: integer
        description: The ending port of the network ACL rule.
        required: false
      icmp-type:
        type: integer
        description: The ICMP type of the network ACL rule.
        required: false
      icmp-code:
        type: integer
        description: The ICMP code of the network ACL rule.
        required: false
      description:
        type: string
        description: The description of the network ACL rule.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the network ACL rule.

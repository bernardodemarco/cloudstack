tosca_definitions_version: tosca_2_0

description: >
  Vpc node type definition.

node_types:
  Vpc:
    metadata:
      provisioning-api: createVPC
      rollback-api: deleteVPC
    properties:
      zone-id:
        type: string
        description: The ID of the availability zone.
        required: true
        metadata:
          api-parameter: zoneid
      vpc-offering-id:
        type: string
        description: The ID of the VPC offering.
        required: true
        metadata:
          api-parameter: vpcofferingid
      name:
        type: string
        description: The name of the VPC.
        required: true
      display-text:
        type: string
        description: Display text of the VPC.
        required: false
        metadata:
          api-parameter: displaytext
      cidr:
        type: string
        description: The CIDR of the VPC.
        required: true
      source-nat-ip-address:
        type: string
        description: The source NAT IPv4 address for the VPC.
        required: false
        metadata:
          api-parameter: sourcenatipaddress
      start:
        type: boolean
        description: Whether the VPC should start immediately.
        required: false
      account:
        type: string
        description: "The name of the account associated with the VPC. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the VPC.
        required: false
        metadata:
          api-parameter: domainid
      project-id:
        type: string
        description: The ID of the project associated with the VPC.
        required: false
        metadata:
          api-parameter: projectid
      first-dns:
        type: string
        description: The first IPv4 DNS of the VPC.
        required: false
        metadata:
          api-parameter: dns1
      second-dns:
        type: string
        description: The second IPv4 DNS of the VPC.
        required: false
        metadata:
          api-parameter: dns2
    attributes:
      id:
        type: string
        description: The ID of the VPC.
      zone-name:
        type: string
        description: The name of the zone the VPC belongs to.
        metadata:
          api-response-attribute: zonename
      vpc-offering-name:
        type: string
        description: The name of the VPC offering used to create the VPC.
        metadata:
          api-response-attribute: vpcofferingname
      domain-path:
        type: string
        description: The domain path of the VPC's owner.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the VPC.
        metadata:
          api-response-attribute: project

tosca_definitions_version: tosca_2_0

description: >
  User node type definition.

node_types:
  User:
    properties:
      account:
        type: string
        description: "The account of the user. It must be used with the 'domain-id' property."
        required: true
      domain-id:
        type: string
        description: The ID of the domain associated with the user's account.
        required: true
      username:
        type: string
        description: The username of the user.
        required: true
      password:
        type: string
        description: The password of the user.
        required: true
      email:
        type: string
        description: The email of the user.
        required: true
      first-name:
        type: string
        description: The first name of the user.
        required: true
      last-name:
        type: string
        description: The last name of the user.
        required: true
      timezone:
        type: string
        description: The timezone of the user.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the user.
      account-id:
        type: string
        description: The ID of the account associated with the user.

tosca_definitions_version: tosca_2_0

description: >
  SshKeyPair node type definition.

node_types:
  SshKeyPair:
    properties:
      name:
        type: string
        description: Name of the SSH key pair.
        required: true
      public-key:
        type: string
        description: Public key of the SSH key pair.
        required: true
      account:
        type: string
        description: The name of the account associated with the SSH key pair. It must be used with the domain-id property.
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the SSH key pair.
        required: false
      project-id:
        type: string
        description: The project ID associated with the SSH key pair.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the SSH key pair.

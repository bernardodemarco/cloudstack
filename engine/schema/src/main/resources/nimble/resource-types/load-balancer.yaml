tosca_definitions_version: tosca_2_0

description: >
  LoadBalancer node type definition.

node_types:
  LoadBalancer:
    properties:
      name:
        type: string
        description: The name of the load balancer.
        required: true
      private-port:
        type: integer
        description: The private port of the VM for which the network traffic will be load balanced to.
        required: true
      public-port:
        type: integer
        description: The public port from where the network traffic will be load balanced from.
        required: true
      algorithm:
        type: string
        description: "Load balancer algorithm. Valid values are 'source', 'roundrobin' and 'leastconn'."
        validation: { $valid_values: [ $value, [source, roundrobin, leastconn] ] }
        required: true
      network-id:
        type: string
        description: The network for which the load balancer will be created for.
        required: false
      ip-address-id:
        type: string
        required: false
        description: The ID of the public IP address where the network traffic will be load balanced from..
      protocol:
        type: string
        description: "Load balancer protocol. Valid values are 'tcp', 'udp', 'tcp-proxy' and 'ssl'."
        validation: { $valid_values: [ $value, [tcp, udp, tcp-proxy, ssl] ] }
        required: false
      cidr-list:
        type: list
        entry_schema:
          type: string
        description: The source CIDR list to allow traffic from.
        required: false
      account:
        type: string
        description: "The name of the account associated with the load balancer. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the load balancer.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the load balancer.

tosca_definitions_version: tosca_2_0

description: >
  FirewallRule node type definition.

node_types:
  FirewallRule:
    properties:
      ip-address-id:
        type: string
        required: true
        description: The ID of the public IP address for the firewall rule.
      cidr-list:
        type: list
        description: The CIDR list for the source CIDRs.
        required: false
        entry_schema:
          type: string
      protocol:
        type: string
        description: The network protocol (TCP, UDP, ICMP).
        required: true
        validation: { $valid_values: [ $value, [TCP, UDP, ICMP ] ] }
      start-port:
        type: integer
        required: false
        description: The starting port of the rule.
      end-port:
        type: integer
        required: false
        description: The ending port of the rule.
      icmp-type:
        type: integer
        description: The ICMP type.
        required: false
      icmp-code:
        type: integer
        description: The ICMP code.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the firewall rule.

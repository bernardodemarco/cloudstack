tosca_definitions_version: tosca_2_0

description: >
  EgressFirewallRule node type definition.

node_types:
  EgressFirewallRule:
    properties:
      network-id:
        type: string
        description: The ID of the network this rule belongs to.
        required: true
      protocol:
        type: string
        description: The protocol of the egress rule.
        required: true
        validation: { $valid_values: [ $value, [TCP, UDP, ICMP, ALL] ] }
      source-cidr-list:
        type: list
        entry_schema:
          type: string
        description: The CIDR list for source CIDRs.
        required: false
      destination-cidr-list:
        type: list
        entry_schema:
          type: string
        description: The CIDR list for destination CIDRs.
        required: false
      start-port:
        type: integer
        description: The starting port of the rule.
        required: false
      end-port:
        type: integer
        description: The ending port of the rule.
        required: false
      icmp-type:
        type: integer
        description: The ICMP type.
        required: false
      icmp-code:
        type: integer
        description: The ICMP code.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the egress firewall rule.

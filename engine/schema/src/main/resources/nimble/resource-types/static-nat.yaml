tosca_definitions_version: tosca_2_0

description: >
  StaticNat node type definition.

node_types:
  StaticNat:
    properties:
      ip-address-id:
        type: string
        description: The ID of the public IP address for which the static NAT is enabled.
        required: true
      virtual-machine-id:
        type: string
        description: The ID of the virtual machine for which the static NAT is enabled.
        required: true
      vm-guest-ip:
        type: string
        description: The VM IP address to forward the static NAT traffic to.
        required: false

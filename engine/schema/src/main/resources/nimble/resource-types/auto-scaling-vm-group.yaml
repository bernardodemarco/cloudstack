tosca_definitions_version: tosca_2_0

description: >
  AutoScalingVmGroup node type definition.

node_types:
  AutoScalingVmGroup:
    metadata:
      provisioning-api: createAutoScaleVmGroup
      rollback-api: deleteAutoScaleVmGroup
    properties:
      name:
        type: string
        description: The name of the auto scaling VM group.
        required: false
      vm-profile-id:
        type: string
        description: The auto scaling profile that contains information about the VMs in the VM group.
        required: true
        metadata:
          api-parameter: vmprofileid
      scale-up-policy-ids:
        type: list
        entry_schema:
          type: string
        description: List of scale up auto scaling policies.
        required: true
        metadata:
          api-parameter: scaleuppolicyids
      scale-down-policy-ids:
        type: list
        entry_schema:
          type: string
        description: List of scale down auto scaling policies.
        required: true
        metadata:
          api-parameter: scaledownpolicyids
      min-members:
        type: integer
        description: The minimum number of VMs in the VM group.
        required: true
        metadata:
          api-parameter: minmembers
      max-members:
        type: integer
        description: The maximum number of VMs in the VM group.
        required: true
        metadata:
          api-parameter: maxmembers
      load-balancer-id:
        type: string
        description: The ID of the load balancer that is associated with the VM group.
        required: true
        metadata:
          api-parameter: lbruleid
      interval:
        type: integer
        description: The interval in which the performance counters will be collected.
        required: false
    attributes:
      id:
        type: string
        description: ID of the auto scaling VM group.
      network-name:
        type: string
        description: The name of the network that is associated with the auto scaling VM group's load balancer.
        metadata:
          api-response-attribute: associatednetworkname
      network-id:
        type: string
        description: The ID of the network that is associated with the auto scaling VM group's load balancer.
        metadata:
          api-response-attribute: associatednetworkid
      public-ip-address:
        type: string
        description: The public IP address of the auto scaling VM group's load balancer.
        metadata:
          api-response-attribute: publicip
      public-ip-address-id:
        type: string
        description: The ID of the public IP address of the auto scaling VM group's load balancer.
        metadata:
          api-response-attribute: publicipid
      domain-path:
        type: string
        description: The domain path of the owner of the auto scaling VM group.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the auto scaling VM group.
        metadata:
          api-response-attribute: project
      account-name:
        type: string
        description: The name of the account associated with the auto scaling VM group.
        metadata:
          api-response-attribute: account

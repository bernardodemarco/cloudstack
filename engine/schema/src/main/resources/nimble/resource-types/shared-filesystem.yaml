tosca_definitions_version: tosca_2_0

description: >
  SharedFilesystem node type definition.

node_types:
  SharedFilesystem:
    metadata:
      provisioning-api: createSharedFileSystem
      rollback-api: expungeSharedFileSystem
    properties:
      zone-id:
        type: string
        description: The ID of the availability zone.
        required: true
        metadata:
          api-parameter: zoneid
      name:
        type: string
        description: The name of the shared filesystem.
        required: true
      description:
        type: string
        description: The description of the shared filesystem.
        required: false
      account:
        type: string
        description: "The name of the account associated with the shared filesystem. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the shared filesystem.
        required: false
        metadata:
          api-parameter: domainid
      project-id:
        type: string
        description: The project ID associated with the shared filesystem.
        required: false
        metadata:
          api-parameter: projectid
      filesystem:
        type: string
        description: >
          The filesystem format that will be installed on the shared filesystem.
          Valid values are: 'xfs' and 'ext4'.
        validation: { $valid_values: [ $value, [ xfs, ext4 ] ] }
        required: true
      network-id:
        type: string
        description: The ID of the network in which the shared filesystem will be attached to.
        required: true
        metadata:
          api-parameter: networkid
      service-offering-id:
        type: string
        description: Service offering ID for the shared filesystem VM hosting the data.
        required: true
        metadata:
          api-parameter: serviceofferingid
      disk-offering-id:
        type: string
        description: Disk offering ID to use for the underlying storage.
        required: true
        metadata:
          api-parameter: diskofferingid
      size:
        type: integer
        description: The size of the shared filesystem in GiB.
        required: false
      provider:
        type: string
        description: > 
          The provider of the shared filesystem. The list of providers
          can be fetched by using the 'listSharedFileSystemProviders' API.
        required: false
      min-iops:
        type: integer
        description: Minimum IOPS.
        required: false
        metadata:
          api-parameter: miniops
      max-iops:
        type: integer
        description: Maximum IOPS.
        required: false
        metadata:
          api-parameter: maxiops
    attributes:
      id:
        type: string
        description: The ID of the shared filesystem.
      zone-name:
        type: string
        description: The name of the zone the VM belongs to.
        metadata:
          api-response-attribute: zonename
      domain-path:
        type: string
        description: The domain path of the VM's owner.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the VM.
        metadata:
          api-response-attribute: project
      service-offering-name:
        type: string
        description: The name of the service offering used to create the VM.
        metadata:
          api-response-attribute: serviceofferingname
      disk-offering-name:
        type: string
        description: The name of the disk offering used to create the VM's disk.'
        metadata:
          api-response-attribute: diskofferingname

tosca_definitions_version: tosca_2_0

description: >
  AutoScalingVmProfile node type definition.

data_types:
  NameValueMapping:
    properties:
      name:
        type: string
        description: The name of the key-value pair.
        required: true
      value:
        type: string
        description: The value of the key-value pair.
        required: true

node_types:
  AutoScalingVmProfile:
    metadata:
      provisioning-api: createAutoScaleVmProfile
      rollback-api: deleteAutoScaleVmProfile
    properties:
      zone-id:
        type: string
        description: The ID of the availability zone.
        required: true
        metadata:
          api-parameter: zoneid
      service-offering-id:
        type: string
        description: Service offering ID for the VMs in the auto scaling VM profile.
        required: true
        metadata:
          api-parameter: serviceofferingid
      template-id:
        type: string
        description: The ID of the template from which the auto deployed VMs will be provisioned.
        required: true
        metadata:
          api-parameter: templateid
      other-deploy-params:
        type: list
        entry_schema:
          type: NameValueMapping
        description: Other deployment parameters.
        required: false
        metadata:
          api-parameter: otherdeployparams
      expunge-vm-grace-period:
        type: integer
        description: The time allowed for existing connections to get closed before a VM is expunged.
        required: false
        metadata:
          api-parameter: expungevmgraceperiod
      account:
        type: string
        description: "The name of the account associated with the auto scaling VM profile. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the auto scaling VM profile.
        required: false
        metadata:
          api-parameter: domainid
      project-id:
        type: string
        description: The project ID associated with the auto scaling VM profile.
        required: false
        metadata:
          api-parameter: projectid
      auto-scale-user-id:
        type: string
        description: The ID of the user used to launch and destroy the VMs.
        required: false
        metadata:
          api-parameter: autoscaleuserid
      counter-parameters:
        type: list
        entry_schema:
          type: NameValueMapping
        required: false
        description: Counter parameters list.
        metadata:
          api-parameter: counterparam
      user-data-id:
        type: string
        description: The ID of the user data.
        required: false
        metadata:
          api-parameter: userdataid
      user-data-details:
        type: map
        entry_schema:
          type: string
        description: User data details.
        required: false
        metadata:
          api-parameter: userdatadetails
      user-data:
        type: string
        description: User data.
        required: false
        metadata:
          api-parameter: userdata
    attributes:
      id:
        type: string
        description: The ID of the auto scaling VM profile.

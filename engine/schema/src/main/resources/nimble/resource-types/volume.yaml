tosca_definitions_version: tosca_2_0

description: >
  Volume node type definition.

node_types:
  Volume:
    metadata:
      provisioning-api: createVolume
      rollback-api: deleteVolume
    properties:
      name:
        type: string
        description: The name for the volume.
        required: true
      zone-id:
        type: string
        description: The ID of the zone in which the volume will be created.
        required: true
        metadata:
          api-parameter: zoneid
      disk-offering-id:
        type: string
        description: The ID of the disk offering for the volume.
        required: false
        metadata:
          api-parameter: diskofferingid
      size:
        type: integer
        description: The size of the volume.
        required: false
      min-iops:
        type: integer
        description: The minimum IOPS for the volume.
        required: false
        metadata:
          api-parameter: miniops
      max-iops:
        type: integer
        description: The maximum IOPS for the volume.
        required: false
        metadata:
          api-parameter: maxiops
      account:
        type: string
        description: The account name associated with the volume. It must be used with the domain-id property.
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the volume.
        required: false
        metadata:
          api-parameter: domainid
      project-id:
        type: string
        description: The project ID associated with the volume.
        required: false
        metadata:
          api-parameter: projectid
    attributes:
      id:
        type: string
        description: ID of the volume.
      zone-name:
        type: string
        description: Name of the zone in which the volume is created.
        metadata:
          api-response-attribute: zonename
      domain-path:
        type: string
        description: The domain path of the volume's owner.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the volume.
        metadata:
          api-response-attribute: project
      disk-offering-name:
        type: string
        description: The name of the disk offering associated with the volume.
        metadata:
          api-response-attribute: diskofferingname

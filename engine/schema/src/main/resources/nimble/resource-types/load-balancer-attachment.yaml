tosca_definitions_version: tosca_2_0

description: >
  LoadBalancerAttachment node type definition.

data_types:
  VirtualMachineIpMapping:
    properties:
      virtual-machine-id:
        type: string
        description: The ID of the virtual machine.
        required: true
        metadata:
          api-parameter: vmid
      ip:
        type: string
        description: The internal IP address of the virtual machine.
        required: true
        metadata:
          api-parameter: vmip

node_types:
  LoadBalancerAttachment:
    metadata:
      provisioning-api: assignToLoadBalancerRule
      rollback-api: removeFromLoadBalancerRule
    properties:
      load-balancer-id:
        type: string
        description: The ID of the load balancer.
        required: true
        metadata:
          api-parameter: id
      virtual-machine-ids:
        type: list
        entry_schema:
          type: string
        description: The list of IDs of the virtual machines to attach to the load balancer.
        required: true
        metadata:
          api-parameter: virtualmachineids
      virtual-machine-ip-map:
        type: list
        entry_schema:
          type: VirtualMachineIpMapping
        description: The mapping between virtual machine IDs and their internal IP addresses.
        required: true
        metadata:
          api-parameter: vmidipmap

tosca_definitions_version: tosca_2_0

description: >
  Network node type definition.

node_types:
  Network:
    properties:
      zone-id:
        type: string
        description: The ID of the zone in which the network will be created.
        required: true
      name:
        type: string
        description: The name of the network.
        required: true
      network-offering-id:
        type: string
        description: The ID of the network offering that will be used to create the network.
        required: true
      display-text:
        type: string
        description: The display text of the network.
        required: false
      netmask:
        type: string
        description: The netmask of the network.
        required: false
      gateway:
        type: string
        description: The gateway of the network.
        required: false
      vlan:
        type: integer
        description: The VLAN number the network will use.
        required: false
      acl-id:
        type: string
        description: The ACL ID that will be attached to the network.
        required: false
      vpc-id:
        type: string
        description: The ID of the VPC in which the network will be created.
        required: false
      account:
        type: string
        description: "The name of the account associated with the network. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the network.
        required: false
      project-id:
        type: string
        description: The ID of the project associated with the network.
        required: false
      scope:
        type: string
        description: "The scope of the network. Valid values are: 'all', 'domain' and 'project'."
        required: false
        validation: { $valid_values: [ $value, [all, domain, project] ] }
      sub-domain-access:
        type: boolean
        description: >
          "Indicates whether sub-domain access is enabled for the network.
          It should be used when the 'scope' property is set to 'domain'."
        required: false
      source-nat-ip-address:
        type: string
        description: The IPv4 source NAT IP address of the network.
        required: false
      first-dns:
        type: string
        description: The first IPv4 DNS of the network.
        required: false
      second-dns:
        type: string
        description: The second IPv4 DNS of the network.
        required: false
      start-ip:
        type: string
        description: The starting IPv4 address of the network.
        required: false
      end-ip:
        type: string
        description: The ending IPv4 address of the network.
        required: false
    attributes:
      id:
        type: string
        description: ID of the network.
      source-nat-ip-address:
        type: string
        description: The source NAT IP address of the network.
      source-nat-ip-id:
        type: string
        description: The ID of the source NAT IP of the network.

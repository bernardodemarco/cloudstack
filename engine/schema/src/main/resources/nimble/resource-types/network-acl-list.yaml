tosca_definitions_version: tosca_2_0

description: >
  NetworkAclList node type definition.

node_types:
  NetworkAclList:
    metadata:
      provisioning-api: createNetworkACLList
      rollback-api: deleteNetworkACLList
    properties:
      name:
        type: string
        required: true
        description: The name of the ACL List.
      description:
        type: string
        required: false
        description: The description of the ACL List.
      vpc-id:
        type: string
        required: false
        description: The ID of the VPC that will be associated with the ACL List.
        metadata:
          api-parameter: vpcid
    attributes:
      id:
        type: string
        description: The ID of the ACL List.

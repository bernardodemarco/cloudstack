tosca_definitions_version: tosca_2_0

description: >
  Account node type definition.

node_types:
  Account:
    metadata:
      provisioning-api: createAccount
      rollback-api: deleteAccount
    properties:
      domain-id:
        type: string
        description: The ID of the domain associated with the user's account.
        required: true
        metadata:
          api-parameter: domainid
      username:
        type: string
        description: The username that will be used to created the first user of the account.
        required: true
      account:
        type: string
        description: >
          "The name of the account to be created. If not specified, the value
          defined in the 'username' property will be used."
        required: false
      role-id:
        type: string
        description: The ID of the role to be assigned to the account.
        required: true
        metadata:
          api-parameter: roleid
      password:
        type: string
        description: The password of the user.
        required: true
      email:
        type: string
        description: The email of the user.
        required: true
      first-name:
        type: string
        description: The first name of the user.
        required: true
        metadata:
          api-parameter: firstname
      last-name:
        type: string
        description: The last name of the user.
        required: true
        metadata:
          api-parameter: lastname
      timezone:
        type: string
        description: The timezone of the user.
        required: false
    attributes:
      id:
        type: string
        description: The ID of the account.
      user-id:
        type: string
        description: The ID of the account's user.

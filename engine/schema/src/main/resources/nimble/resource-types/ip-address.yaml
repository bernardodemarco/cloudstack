tosca_definitions_version: tosca_2_0

description: >
  IpAddress node type definition.

node_types:
  IpAddress:
    metadata:
      provisioning-api: associateIpAddress
      rollback-api: disassociateIpAddress
    properties:
      zone-id:
        type: string
        description: The ID of the zone from which an IP address will be acquired.
        required: false
        metadata:
          api-parameter: zoneid
      ip-address:
        type: string
        description: The IP address to be acquired.
        required: false
        metadata:
          api-parameter: ipaddress
      network-id:
        type: string
        description: "The ID of the network for which the IP address will be associated. Mutually exclusive with the 'vpc-id' property."
        required: false
        metadata:
          api-parameter: networkid
      vpc-id:
        type: string
        description: "The ID of the VPC for which the IP address will associated. Mutually exclusive with the 'network-id' property."
        required: false
        metadata:
          api-parameter: vpcid
    attributes:
      id:
        type: string
        description: The ID of the IP address.
      ip-address:
        type: string
        description: The acquired IP address.
        metadata:
          api-response-attribute: ipaddress
      domain-path:
        type: string
        description: The domain path to which the public IP address belongs.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the public IP address.
        metadata:
          api-response-attribute: project
      zone-name:
        type: string
        description: The name of the zone the public IP address belongs to.
        metadata:
          api-response-attribute: zonename

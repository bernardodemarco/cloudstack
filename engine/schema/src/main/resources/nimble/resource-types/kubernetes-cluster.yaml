tosca_definitions_version: tosca_2_0

description: >
  KubernetesCluster node type definition.

data_types:
  NodeOffering:
    properties:
      node:
        type: string
        description: "Node type (e.g. 'control', 'worker') for which the offering will be applied."
        required: true
      offering:
        type: string
        description: ID of the service offering to be used for this node type.
        required: true
  NodeTemplate:
    properties:
      node:
        type: string
        description: "Node type (e.g. 'control', 'worker') for which the template will be used."
        required: true
      template:
        type: string
        description: ID of the template to be used for this node type.
        required: true

node_types:
  KubernetesCluster:
    metadata:
      provisioning-api: createKubernetesCluster
      rollback-api: deleteKubernetesCluster
    properties:
      zone-id:
        type: string
        description: The ID of the availability zone.
        required: true
        metadata:
          api-parameter: zoneid
      name:
        type: string
        description: The name of the Kubernetes cluster.
        required: true
      description:
        type: string
        description: The description of the cluster.
        required: false
      account:
        type: string
        description: "The name of the account associated with the cluster. It must be used with the 'domain-id' property."
        required: false
      domain-id:
        type: string
        description: The domain ID associated with the cluster.
        required: false
        metadata:
          api-parameter: domainid
      project-id:
        type: string
        description: The project ID associated with the cluster.
        required: false
        metadata:
          api-parameter: projectid
      kubernetes-version-id:
        type: string
        description: Kubernetes version ID used to launch the cluster.
        required: false
        metadata:
          api-parameter: kubernetesversionid
      network-id:
        type: string
        description: The ID of the network in which the cluster will be launched.
        required: false
        metadata:
          api-parameter: networkid
      node-root-disk-size:
        type: integer
        description: Root disk size (GB) for each node.
        required: false
        metadata:
          api-parameter: noderootdisksize
      service-offering-id:
        type: string
        description: Service offering ID for the VMs in the cluster.
        required: false
        metadata:
          api-parameter: serviceofferingid
      size:
        type: integer
        description: Number of worker nodes in the cluster.
        required: false
      control-nodes:
        type: integer
        description: Number of control nodes in the cluster.
        required: false
        metadata:
          api-parameter: controlnodes
      ssh-key-pair:
        type: string
        description: The name of the SSH key pair for logging into the VMs.
        required: false
        metadata:
          api-parameter: keypair
      cluster-type:
        type: string
        description: Kubernetes cluster type (CloudManaged or ExternalManaged).
        required: false
        validation: { $valid_values: [ $value, [ CloudManaged, ExternalManaged ] ] }
        metadata:
          api-parameter: clustertype
      docker-registry-password:
        type: string
        description: Password for the Docker image private registry.
        required: false
        metadata:
          api-parameter: dockerregistrypassword
      docker-registry-url:
        type: string
        description: URL for the Docker image private registry.
        required: false
        metadata:
          api-parameter: dockerregistryurl
      docker-registry-username:
        type: string
        description: Username for the Docker image private registry.
        required: false
        metadata:
          api-parameter: dockerregistryusername
      external-load-balancer-ip-address:
        type: string
        description: External load balancer IP address for HA clusters.
        required: false
        metadata:
          api-parameter: externalloadbalanceripaddress
      hypervisor:
        type: string
        description: Hypervisor on which the cluster VMs will be launched.
        required: false
      etcd-nodes:
        type: integer
        description: Number of etcd nodes in the cluster.
        required: false
        metadata:
          api-parameter: etcdnodes
      node-offerings:
        type: list
        entry_schema:
          type: NodeOffering
        description: "Compute offerings for each node type. If used, overrides the 'service-offering-id' property."
        required: false
        metadata:
          api-parameter: nodeofferings
      node-templates:
        type: list
        entry_schema:
          type: NodeTemplate
        description: Templates for each node type. If not specified, the system VM templates will be used.
        required: false
        metadata:
          api-parameter: nodetemplates
    attributes:
      id:
        type: string
        description: The ID of the Kubernetes cluster.
      zone-name:
        type: string
        description: The name of the zone the Kubernetes cluster belongs to.
        metadata:
          api-response-attribute: zonename
      domain-path:
        type: string
        description: The domain path of the Kubernetes cluster's owner.
        metadata:
          api-response-attribute: domainpath
      project-name:
        type: string
        description: The name of the project associated with the Kubernetes cluster.
        metadata:
          api-response-attribute: project
      kubernetes-version-name:
        type: string
        description: The name of the Kubernetes version used to launch the cluster.
        metadata:
          api-response-attribute: kubernetesversionname
      public-ip-address:
        type: string
        description: Public IP address of the Kubernetes cluster.
        metadata:
          api-response-attribute: ipaddress
      public-ip-address-id:
        type: string
        description: Public IP address ID of the Kubernetes cluster.
        metadata:
          api-response-attribute: ipaddressid
